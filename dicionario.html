 <h1>📖 DICIONÁRIO<br>JURÍDICO</h1>
 <p class="sub">Os termos do Direito explicados em palavras simples, com exemplo. Digite para buscar ou escolha um tema.</p>

<script>
const D=[{"s": "1. Crime, contravenção e as partes do crime", "t": [{"a": "Infração penal", "b": "Nome geral para tudo que a lei penal pune. Divide-se em crime e contravenção.", "e": "Furto (crime) e jogo do bicho (contravenção) são infrações penais."}, {"a": "Crime (ou delito)", "b": "Infração mais grave, punida com reclusão ou detenção. No Brasil, crime e delito são a mesma coisa.", "e": "Roubo, homicídio, estelionato."}, {"a": "Contravenção penal", "b": "Infração \"menor\", punida no máximo com prisão simples ou multa. Está na Lei das Contravenções Penais. A tentativa de contravenção não é punida.", "e": "Jogo do bicho, vias de fato (empurrão sem machucar)."}, {"a": "Fato típico", "b": "Conduta que se encaixa exatamente na descrição de um crime na lei.", "e": "Pegar a carteira de alguém se encaixa em \"subtrair coisa alheia móvel\" (furto)."}, {"a": "Tipo penal", "b": "O texto da lei que descreve o crime.", "e": "Art. 155 do CP: \"Subtrair, para si ou para outrem, coisa alheia móvel\"."}, {"a": "Ilicitude (antijuridicidade)", "b": "A conduta é contra o Direito. Deixa de ser ilícita quando há uma excludente (seção 2).", "e": "Matar é ilícito; matar em legítima defesa não é."}, {"a": "Culpabilidade", "b": "Se dá para reprovar a pessoa: ela entendia o que fazia e podia agir diferente.", "e": "Um adulto são que furta é culpável; um doente mental grave pode não ser."}, {"a": "Dolo", "b": "Quando a pessoa QUER o resultado ou aceita o risco de causá-lo.", "e": "Atirar em alguém para matar."}, {"a": "Dolo eventual", "b": "A pessoa não quer o resultado, mas assume o risco: \"tanto faz\".", "e": "Racha em rua cheia sabendo que pode matar alguém."}, {"a": "Culpa", "b": "A pessoa não quer o resultado, mas causa por descuido: imprudência, negligência ou imperícia.", "e": "Atropelar por dirigir mexendo no celular."}, {"a": "Imprudência / negligência / imperícia", "b": "Imprudência = fazer algo arriscado. Negligência = deixar de ter o cuidado devido. Imperícia = falta de técnica na profissão.", "e": "Correr demais / não trocar o freio gasto / médico que erra o procedimento."}, {"a": "Consumação", "b": "O crime ficou completo: aconteceu tudo o que a lei descreve.", "e": "O furto se consuma quando o ladrão fica com a coisa, mesmo por pouco tempo."}, {"a": "Tentativa", "b": "O crime começou, mas não terminou por algo fora da vontade do agente. A pena cai de 1/3 a 2/3.", "e": "O ladrão é preso enquanto tentava abrir o carro."}, {"a": "Desistência voluntária", "b": "O agente começa e para por vontade própria. Responde só pelo que já fez.", "e": "Começa a arrombar a porta, desiste e vai embora: responde pelo dano."}, {"a": "Arrependimento posterior", "b": "Em crime sem violência, devolve ou repara tudo antes de a denúncia ser recebida. A pena cai de 1/3 a 2/3.", "e": "Quem furtou devolve o celular antes de o processo começar."}, {"a": "Crime impossível", "b": "Não havia como o crime acontecer. Não é punido.", "e": "Tentar matar alguém que já estava morto."}, {"a": "Sujeito ativo / passivo", "b": "Ativo = quem pratica o crime. Passivo = a vítima.", "e": "No roubo: o assaltante (ativo) e quem foi roubado (passivo)."}, {"a": "Coautor / partícipe", "b": "Coautor executa o crime junto. Partícipe ajuda sem executar (empresta a arma, dá a ideia).", "e": "Dois assaltam juntos (coautores); um terceiro só emprestou o carro (partícipe)."}]}, {"s": "2. Quando não há crime ou não há pena", "t": [{"a": "Excludente de ilicitude", "b": "Situação em que a lei permite a conduta. Então não há crime. São quatro (art. 23 do CP), listadas abaixo.", "e": "Legítima defesa, estado de necessidade, estrito cumprimento do dever legal e exercício regular de direito."}, {"a": "Legítima defesa", "b": "Reagir, com os meios necessários e sem exagero, a uma agressão injusta, atual ou iminente, contra você ou outra pessoa.", "e": "Empurrar quem tenta te esfaquear. Policial que atira para salvar um refém."}, {"a": "Estado de necessidade", "b": "Sacrificar um bem para salvar outro de um perigo atual que você não causou.", "e": "Arrombar a porta de um vizinho para salvar alguém de um incêndio."}, {"a": "Estrito cumprimento do dever legal", "b": "Agir porque a lei manda, dentro do limite.", "e": "Policial que prende alguém em flagrante não comete sequestro."}, {"a": "Exercício regular de direito", "b": "Usar um direito que a lei dá.", "e": "Lutador de boxe que fere o adversário na luta."}, {"a": "Excesso", "b": "Passar do limite numa excludente. O excesso é punido.", "e": "Continuar batendo no agressor que já está desacordado."}, {"a": "Imputável / inimputável", "b": "Imputável = pode responder criminalmente. Inimputável = não pode, por doença mental grave ou idade.", "e": "Menor de 18 anos é inimputável e responde pelo ECA."}, {"a": "Ato infracional", "b": "Nome do \"crime\" quando quem pratica é criança ou adolescente (ECA).", "e": "Adolescente de 16 anos que rouba comete ato infracional."}, {"a": "Semi-imputável", "b": "Entende só em parte o que faz por problema mental. Responde, com pena reduzida.", "e": "Pessoa com deficiência mental moderada."}, {"a": "Erro de tipo", "b": "A pessoa se engana sobre um fato. Se o erro for inevitável, não há dolo.", "e": "Leva a mala de outra pessoa achando que era a sua (iguais)."}, {"a": "Coação moral irresistível", "b": "Alguém é forçado por grave ameaça a cometer o crime. Só o coator responde.", "e": "Gerente que abre o cofre porque bandidos mantêm a família dele refém."}]}, {"s": "3. Penas e tipos de crime", "t": [{"a": "Reclusão", "b": "Pena de prisão para crimes mais graves. Pode começar no regime fechado.", "e": "Roubo, homicídio, tráfico."}, {"a": "Detenção", "b": "Pena de prisão para crimes menos graves. Começa no semiaberto ou aberto.", "e": "Lesão corporal leve, ameaça."}, {"a": "Prisão simples", "b": "Pena das contravenções. Nunca em regime fechado.", "e": "Contravenção de jogo de azar."}, {"a": "Regimes (fechado, semiaberto, aberto)", "b": "Fechado = presídio. Semiaberto = colônia agrícola ou industrial. Aberto = casa de albergado, trabalha de dia.", "e": "Pena acima de 8 anos começa, em regra, no fechado."}, {"a": "Crime hediondo", "b": "Crime que a lei considera muito grave (Lei 8.072/90). Não tem fiança, anistia, graça nem indulto.", "e": "Latrocínio, estupro, homicídio qualificado."}, {"a": "Equiparado a hediondo", "b": "Recebe o mesmo tratamento duro, por ordem da Constituição: os \"3 T\".", "e": "Tortura, Tráfico de drogas e Terrorismo."}, {"a": "Crime de menor potencial ofensivo", "b": "Contravenções e crimes com pena máxima de até 2 anos. Vão para o Juizado Especial Criminal (JECRIM).", "e": "Ameaça, lesão leve, desacato."}, {"a": "Transação penal", "b": "Acordo no JECRIM: a pessoa aceita uma pena alternativa e não vira processo.", "e": "Quem ameaçou o vizinho aceita prestar serviços à comunidade."}, {"a": "Qualificadora", "b": "Circunstância que muda a faixa da pena para uma mais alta.", "e": "Furto com rompimento de obstáculo (arrombamento) é furto qualificado."}, {"a": "Agravante / atenuante", "b": "Aumentam ou diminuem um pouco a pena, dentro da faixa.", "e": "Reincidência agrava; confessar atenua."}, {"a": "Reincidente", "b": "Quem comete novo crime depois de já ter condenação definitiva por outro.", "e": "Condenado por furto em 2023 que rouba em 2025."}, {"a": "Prescrição", "b": "O Estado perde o direito de punir porque demorou demais.", "e": "Crime pequeno parado anos na Justiça."}, {"a": "Imprescritível", "b": "Nunca prescreve. Pela Constituição, só dois casos.", "e": "Racismo e ação de grupos armados contra o Estado (macete: \"RAÇÃO\")."}, {"a": "Extinção da punibilidade", "b": "Motivo que acaba com a possibilidade de punir.", "e": "Morte do agente, prescrição, perdão judicial."}, {"a": "Anistia / graça / indulto", "b": "Formas de perdão. Anistia = por lei, \"esquece\" o fato. Graça = perdão individual. Indulto = perdão coletivo do Presidente.", "e": "Hediondos não recebem nenhum dos três."}]}, {"s": "4. Investigação e polícia", "t": [{"a": "Inquérito policial (IP)", "b": "Investigação feita pela Polícia Civil, presidida pelo delegado, para descobrir o que aconteceu e quem foi. É escrito, sigiloso e dispensável (o MP pode denunciar sem ele).", "e": "Após um homicídio, o delegado instaura IP, ouve testemunhas e pede perícia."}, {"a": "Instaurar", "b": "Dar início oficialmente a um procedimento.", "e": "\"O delegado instaurou o inquérito por portaria.\""}, {"a": "Portaria", "b": "Documento com que o delegado abre o inquérito quando não há flagrante.", "e": "Crime noticiado no dia seguinte: IP aberto por portaria."}, {"a": "Auto de prisão em flagrante (APF)", "b": "Documento lavrado quando alguém é preso em flagrante. Também abre o inquérito.", "e": "Ladrão preso na hora: o delegado lavra o APF."}, {"a": "Notitia criminis", "b": "\"Notícia do crime\": quando a polícia fica sabendo de um crime.", "e": "Vítima vai à delegacia contar o furto."}, {"a": "Boletim de ocorrência (BO)", "b": "Registro do fato na polícia. Não é investigação: é só o registro.", "e": "Registrar o roubo do celular na delegacia ou na internet."}, {"a": "Termo circunstanciado (TCO)", "b": "Registro simples usado nos crimes de menor potencial ofensivo, no lugar do inquérito. Vai direto ao JECRIM.", "e": "Briga com lesão leve: TCO em vez de IP."}, {"a": "Indiciamento", "b": "Ato do delegado que aponta formalmente alguém como provável autor do crime. É privativo do delegado.", "e": "Depois das provas, o delegado indicia o suspeito por estelionato."}, {"a": "Relatório final", "b": "Documento que encerra o inquérito, resumindo o que foi apurado. Vai para o juiz e o MP.", "e": "O delegado relata o IP e envia à Justiça."}, {"a": "Arquivamento", "b": "Encerrar a investigação sem acusar ninguém. O delegado NÃO pode arquivar inquérito.", "e": "Falta de provas: o MP pede o arquivamento."}, {"a": "Diligência", "b": "Qualquer providência para investigar.", "e": "Ouvir testemunha, buscar imagens de câmera, fazer reconhecimento."}, {"a": "Oitiva", "b": "Ouvir oficialmente uma pessoa (testemunha, vítima, investigado).", "e": "\"Oitiva da vítima marcada para segunda.\""}, {"a": "Polícia judiciária", "b": "Função da Polícia Civil: investigar crimes (exceto militares) e ajudar a Justiça.", "e": "Cumprir mandado de prisão expedido pelo juiz."}, {"a": "Polícia administrativa (ostensiva)", "b": "Função preventiva, fardada, para evitar o crime. Em PE, é da Polícia Militar.", "e": "Patrulha da PM nas ruas."}, {"a": "Autoridade policial", "b": "O delegado de polícia.", "e": "\"A autoridade policial representou pela prisão preventiva.\""}, {"a": "Agente da autoridade", "b": "Policiais que cumprem as ordens do delegado: agentes, escrivães.", "e": "O Agente de Polícia executa as diligências."}]}, {"s": "5. Prisão e liberdade", "t": [{"a": "Flagrante delito", "b": "Crime \"pegando fogo\": a pessoa é presa cometendo o crime ou logo depois.", "e": "Ladrão pego saindo da loja com o produto."}, {"a": "Flagrante próprio", "b": "Preso cometendo o crime ou quando acaba de cometê-lo.", "e": "Pego no meio do assalto."}, {"a": "Flagrante impróprio (quase flagrante)", "b": "Perseguido logo após o crime, sem interrupção. A perseguição pode durar horas.", "e": "Polícia persegue o assaltante por 3 horas sem perdê-lo de vista."}, {"a": "Flagrante presumido (ficto)", "b": "Encontrado logo depois com objetos que fazem presumir que foi ele.", "e": "Achado 1 hora depois com a bolsa da vítima."}, {"a": "Flagrante preparado", "b": "A polícia induz a pessoa a cometer o crime. É ilegal: crime impossível.", "e": "Policial convence alguém a vender droga só para prendê-lo."}, {"a": "Flagrante esperado", "b": "A polícia só espera o crime acontecer, sem induzir. É válido.", "e": "Polícia fica de tocaia no banco após denúncia."}, {"a": "Prisão preventiva", "b": "Prisão decretada pelo juiz antes da condenação, para proteger a investigação, a ordem pública ou garantir a aplicação da lei. Não tem prazo fixo.", "e": "Suspeito ameaçando testemunhas é preso preventivamente."}, {"a": "Prisão temporária", "b": "Prisão só durante o inquérito, decretada pelo juiz. Prazo de 5 dias + 5 (crimes hediondos: 30 + 30).", "e": "Preso por 5 dias para não atrapalhar a investigação."}, {"a": "Audiência de custódia", "b": "O preso em flagrante é levado ao juiz em até 24 horas.", "e": "O juiz decide se solta, mantém preso ou dá liberdade provisória."}, {"a": "Nota de culpa", "b": "Documento entregue ao preso em até 24 horas dizendo o motivo da prisão e quem prendeu.", "e": "Preso recebe a nota de culpa assinada pelo delegado."}, {"a": "Fiança", "b": "Valor pago para responder em liberdade. O delegado pode dar fiança se a pena máxima do crime for de até 4 anos.", "e": "Preso por furto simples paga fiança na delegacia."}, {"a": "Liberdade provisória", "b": "Responder ao processo solto, com ou sem fiança.", "e": "Juiz solta o preso com a obrigação de comparecer mensalmente."}, {"a": "Relaxamento da prisão", "b": "Soltura porque a prisão foi ILEGAL.", "e": "Prisão sem flagrante e sem ordem do juiz é relaxada."}, {"a": "Mandado", "b": "Ordem escrita do juiz.", "e": "Mandado de prisão, mandado de busca e apreensão."}, {"a": "Busca e apreensão", "b": "Procurar e recolher objetos ou pessoas. Em casa, com mandado, só durante o dia.", "e": "Polícia entra às 6h com mandado para apreender drogas."}]}, {"s": "6. Quem acusa e como (ação penal)", "t": [{"a": "Ação penal", "b": "O processo para punir alguém pelo crime.", "e": "O MP entra com a ação contra o assaltante."}, {"a": "Ação penal pública incondicionada", "b": "O MP acusa sozinho, sem depender da vítima. É a regra.", "e": "Homicídio, roubo, tráfico."}, {"a": "Ação penal pública condicionada", "b": "O MP só pode acusar se a vítima autorizar (representação) ou se o Ministro da Justiça requisitar.", "e": "Ameaça comum, estelionato (em regra)."}, {"a": "Representação", "b": "Autorização da vítima para o MP agir. Prazo de 6 meses a partir de quando se sabe quem foi o autor.", "e": "Vítima de ameaça vai à delegacia e representa."}, {"a": "Ação penal privada", "b": "Quem acusa é a própria vítima, com advogado.", "e": "Crimes contra a honra, como a injúria comum."}, {"a": "Queixa-crime", "b": "Peça com que a vítima acusa na ação privada.", "e": "Vítima de difamação apresenta queixa-crime."}, {"a": "Denúncia", "b": "Peça com que o MP acusa alguém na Justiça. Recebida a denúncia, o investigado vira réu.", "e": "\"O MP ofereceu denúncia contra os três assaltantes.\""}, {"a": "Decadência", "b": "Perda do direito de representar ou de dar queixa porque passou o prazo (6 meses).", "e": "Vítima de injúria que espera 1 ano não pode mais dar queixa."}, {"a": "Renúncia / perdão do ofendido", "b": "Renúncia = vítima desiste antes da queixa. Perdão = desiste depois, e o réu precisa aceitar.", "e": "Valem nas ações privadas."}]}, {"s": "7. Pessoas e órgãos do processo", "t": [{"a": "Suspeito", "b": "Pessoa sobre quem recaem suspeitas, sem nada formal.", "e": "\"Há um suspeito, ainda não identificado.\""}, {"a": "Investigado", "b": "Pessoa formalmente investigada no inquérito.", "e": "\"O investigado foi intimado a depor.\""}, {"a": "Indiciado", "b": "Investigado apontado pelo delegado como provável autor (indiciamento).", "e": "\"O indiciado vai responder por furto.\""}, {"a": "Acusado / denunciado", "b": "Contra quem o MP ofereceu denúncia.", "e": "—"}, {"a": "Réu", "b": "Pessoa que responde ao processo depois de a denúncia ser recebida pelo juiz.", "e": "\"O réu será julgado em março.\""}, {"a": "Condenado / apenado", "b": "Quem foi condenado em definitivo e cumpre pena.", "e": "—"}, {"a": "Egresso", "b": "Quem saiu da prisão.", "e": "—"}, {"a": "Ministério Público (MP)", "b": "Promotores que acusam nos crimes de ação pública e fiscalizam a lei. Fazem o controle externo da polícia.", "e": "Promotor de Justiça oferece a denúncia."}, {"a": "Juiz", "b": "Julga o caso e decide sobre prisões, buscas e quebras de sigilo. Não investiga nem acusa.", "e": "Juiz decreta a preventiva."}, {"a": "Defensoria Pública", "b": "Advogados do Estado para quem não pode pagar.", "e": "Preso sem advogado é atendido pela Defensoria."}, {"a": "Delegado de polícia", "b": "Dirige a delegacia e preside o inquérito. Precisa ser bacharel em Direito.", "e": "—"}, {"a": "Agente de Polícia", "b": "Cargo do seu concurso: executa investigações, diligências, prisões e apoio ao delegado.", "e": "—"}, {"a": "Escrivão de polícia", "b": "Registra por escrito os atos do inquérito (depoimentos, autos).", "e": "—"}]}, {"s": "8. Provas e processo", "t": [{"a": "Prova", "b": "Tudo que serve para mostrar como o fato aconteceu.", "e": "Testemunhas, vídeos, laudos."}, {"a": "Perícia", "b": "Exame técnico feito por perito oficial.", "e": "Exame de balística, de DNA, de local do crime."}, {"a": "Laudo", "b": "Documento em que o perito escreve o resultado da perícia.", "e": "Laudo do exame de corpo de delito."}, {"a": "Exame de corpo de delito", "b": "Perícia obrigatória quando o crime deixa vestígios. A confissão não substitui.", "e": "Exame da lesão na vítima de agressão."}, {"a": "Vestígio", "b": "Qualquer marca ou objeto ligado ao crime.", "e": "Sangue, cápsula de bala, digital."}, {"a": "Cadeia de custódia", "b": "Registro de tudo que acontece com um vestígio, da coleta ao descarte, para provar que não foi trocado ou alterado.", "e": "Faca lacrada, numerada e com registro de quem a guardou."}, {"a": "Preservação do local", "b": "Isolar e proteger a cena do crime até a perícia chegar. É tarefa da polícia que chega primeiro.", "e": "Agente isola o local com fita e não deixa ninguém mexer."}, {"a": "Reconhecimento de pessoas", "b": "A vítima ou testemunha aponta o autor entre pessoas parecidas, seguindo o art. 226 do CPP.", "e": "Suspeito colocado ao lado de outros parecidos."}, {"a": "Acareação", "b": "Colocar frente a frente pessoas que deram versões diferentes.", "e": "Duas testemunhas que se contradizem são acareadas."}, {"a": "Prova ilícita", "b": "Prova obtida violando a lei ou a Constituição. Não vale e deve ser retirada do processo.", "e": "Escuta telefônica sem ordem do juiz."}, {"a": "Interceptação telefônica", "b": "Escutar ligações de alguém. Só com ordem do juiz, para crimes punidos com reclusão.", "e": "—"}, {"a": "Sentença", "b": "Decisão do juiz que julga o caso.", "e": "Sentença condenatória ou absolutória."}, {"a": "Recurso", "b": "Pedido para outro tribunal rever a decisão.", "e": "Apelação contra a condenação."}, {"a": "Trânsito em julgado", "b": "Quando não cabe mais recurso: a decisão é definitiva.", "e": "Só depois disso a pessoa é considerada culpada."}, {"a": "Presunção de inocência", "b": "Ninguém é culpado até o trânsito em julgado da condenação.", "e": "—"}, {"a": "Habeas corpus", "b": "Ação para proteger a liberdade de ir e vir contra prisão ilegal ou ameaça de prisão. Qualquer pessoa pode pedir, sem advogado e de graça.", "e": "Preso sem ordem do juiz e sem flagrante pede HC."}, {"a": "Competência", "b": "Qual juiz ou tribunal deve julgar o caso.", "e": "Crime doloso contra a vida vai ao Tribunal do Júri."}, {"a": "Tribunal do Júri", "b": "Julgamento feito por cidadãos (jurados) nos crimes dolosos contra a vida.", "e": "Homicídio doloso, feminicídio."}]}, {"s": "9. Constitucional e Administrativo", "t": [{"a": "Constituição Federal (CF)", "b": "Lei mais importante do país. Nenhuma lei pode contrariá-la.", "e": "—"}, {"a": "Direitos fundamentais", "b": "Direitos básicos da pessoa, sobretudo no art. 5º da CF.", "e": "Vida, liberdade, igualdade, casa inviolável, ficar calado."}, {"a": "Cláusula pétrea", "b": "Parte da CF que não pode ser abolida nem por emenda.", "e": "Direitos e garantias individuais, voto direto e secreto."}, {"a": "Inviolabilidade do domicílio", "b": "Ninguém entra na casa sem consentimento, salvo flagrante, desastre, socorro ou ordem do juiz (esta, só de dia).", "e": "—"}, {"a": "Administração Pública", "b": "Os órgãos e servidores que prestam serviços ao povo.", "e": "A Polícia Civil faz parte dela."}, {"a": "Princípios LIMPE", "b": "Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência (art. 37 da CF).", "e": "O servidor só pode fazer o que a lei permite (legalidade)."}, {"a": "Poder de polícia", "b": "Poder do Estado de limitar direitos individuais em favor do interesse coletivo.", "e": "Vigilância sanitária fecha um restaurante sujo."}, {"a": "Ato administrativo", "b": "Decisão da Administração que produz efeitos.", "e": "Nomeação de um aprovado em concurso."}, {"a": "Anulação / revogação", "b": "Anulação = desfazer ato ilegal. Revogação = desfazer ato legal que deixou de ser conveniente.", "e": "—"}, {"a": "Servidor público efetivo", "b": "Quem entrou por concurso em cargo efetivo.", "e": "Agente de Polícia aprovado e nomeado."}, {"a": "Estágio probatório", "b": "Período de avaliação do novo servidor. Para a estabilidade, são 3 anos.", "e": "—"}, {"a": "Estabilidade", "b": "Proteção do servidor efetivo contra demissão sem processo, após 3 anos e avaliação.", "e": "—"}, {"a": "PAD (processo administrativo disciplinar)", "b": "Processo interno para apurar falta grave do servidor, com direito de defesa.", "e": "Policial acusado de desvio de conduta responde a PAD."}, {"a": "Sindicância", "b": "Apuração mais simples, para faltas leves ou para levantar fatos.", "e": "—"}, {"a": "Demissão / exoneração", "b": "Demissão = punição por falta grave. Exoneração = saída sem punição (a pedido ou por não passar no estágio).", "e": "—"}, {"a": "Improbidade administrativa", "b": "Ato desonesto de agente público: enriquecer ilicitamente, causar prejuízo ao erário ou violar princípios. Exige dolo.", "e": "Servidor que recebe propina para liberar documento."}, {"a": "Responsabilidade objetiva do Estado", "b": "O Estado paga o dano causado por seus agentes, sem precisar provar culpa. Depois pode cobrar do agente culpado.", "e": "Viatura bate em carro: o Estado indeniza o dono."}, {"a": "Abuso de poder", "b": "Excesso de poder (agir além da competência) ou desvio de finalidade (agir para fim diferente do interesse público).", "e": "Delegado que remove servidor por vingança."}]}];
let tema=-1;
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function hl(t,q){if(!q)return esc(t);const n=norm(t),i=n.indexOf(q);if(i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
document.getElementById("chips").innerHTML='<button class="chip on" data-i="-1">TODOS</button>'+["CRIME","SEM CRIME","PENAS","INVESTIGAÇÃO","PRISÃO","AÇÃO PENAL","PESSOAS","PROVAS","CONST. E ADM."].map((l,i)=>`<button class="chip" data-i="${i}">${i+1}. ${l}</button>`).join("");
document.getElementById("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;tema=+b.dataset.i;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));render()};
function render(){const q=norm(document.getElementById("busca").value.trim());let h="",n=0;
 D.forEach((s,i)=>{if(tema>=0&&i!==tema)return;const it=s.t.filter(t=>!q||norm(t.a+" "+t.b+" "+t.e).includes(q));if(!it.length)return;n+=it.length;
  h+=`<div class="sec">${esc(s.s)}</div>`+it.map(t=>`<div class="termo"><b>${hl(t.a,q)}</b><p>${hl(t.b,q)}</p>${t.e&&t.e!=="—"?`<p class="ex">${hl(t.e,q)}</p>`:""}</div>`).join("")});
 document.getElementById("lista").innerHTML=h||'<div class="vazio">Nenhum termo encontrado.</div>';
 document.getElementById("cont").textContent=n+" termo(s)"}
document.getElementById("busca").addEventListener("input",render);render();
</script>
